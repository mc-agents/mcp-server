# A proxy with two backends, for the one tool that cannot be written without one.
#
#     docker compose -f dev/compose.yml up -d
#     ./dev/call.sh join-server '{"bot":"alice","host":"127.0.0.1","port":25579}'
#     ./dev/call.sh switch-server '{"bot":"alice","target":"arena"}'
#
# Everything else in dev/ points at a single Paper server and does not need this. `switch-server`
# is a proxy command and a re-login on the same connection, and guessing at what a proxy says back
# is how the other bot ended up sending a dialog packet no server could decode.
#
# Forwarding is off: the backends are in offline mode and take the name from the handshake, which
# is enough to move a bot between two of them. A real deployment uses modern forwarding and a
# shared secret, and none of that changes what the tool does.
name: mc-agents-proxy-dev

services:
  velocity:
    image: itzg/bungeecord:java25
    tty: true
    stdin_open: true
    ports:
      - "${PROXY_PORT:-25579}:25565"
    environment:
      TYPE: VELOCITY
      MEMORY: 512M
      # The file the proxy writes on first boot would otherwise win over the one mounted below.
      REPLACE_ENV_IN_PLACE: "false"
    volumes:
      # Not read-only: the image chowns what it finds in /server and stops when it cannot.
      - ./proxy/velocity.toml:/server/velocity.toml
      - ./proxy/forwarding.secret:/server/forwarding.secret
    depends_on:
      lobby:
        condition: service_healthy
      arena:
        condition: service_healthy

  lobby: &backend
    image: itzg/minecraft-server:java25
    tty: true
    stdin_open: true
    environment: &backend-env
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "${MC_VERSION:-26.1.2}"
      ONLINE_MODE: "FALSE"
      MODE: creative
      LEVEL_TYPE: minecraft:flat
      GENERATE_STRUCTURES: "false"
      SPAWN_PROTECTION: "0"
      SPAWN_MONSTERS: "FALSE"
      VIEW_DISTANCE: "6"
      MEMORY: 1G
      # A backend behind a proxy is reached through it; published ports would let a bot skip it and
      # then switch-server would be testing nothing.
      RCON_CMDS_STARTUP: |
        difficulty peaceful
        weather clear 1000000
        time set day
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    volumes:
      - lobby:/data

  arena:
    <<: *backend
    environment:
      <<: *backend-env
      # A different world, so a bot that thinks it switched and did not is caught by where it is.
      LEVEL: arena
      SEED: "1234567"
    volumes:
      - arena:/data

volumes:
  lobby:
  arena:
