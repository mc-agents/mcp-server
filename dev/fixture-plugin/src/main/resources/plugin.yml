name: McAgentsFixture
version: "1"
main: kr.junhyung.mcagents.fixture.FixturePlugin
# The oldest server this loads on, not the API it compiles against. The azalea run of the suite is
# still on a 26.1.2 Paper, and Paper refuses a plugin that names an API newer than its own.
api-version: "26.1"
commands:
  fixture:
    description: Start the fixture's conversation or gathering round, or open one of its menus or its board, for a player
    usage: /fixture talk|gather|locked|shop|paged|cooldown|board|overlap|unpack|buttons|pling|quiet|crowd|uncrowd|hold|release|bounce|reconfigure <player>
    permission: mcagents.fixture
permissions:
  mcagents.fixture:
    default: op
