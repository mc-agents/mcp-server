{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mc-agents-mcp-server.fullname" . }}
  labels:
    {{- include "mc-agents-mcp-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mc-agents-mcp-server.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # The bot link carries no authentication, by the decision in docs/architecture.md. This is
    # the gate that decision assumes exists, so turning the policy on is what makes it true.
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.botSelector | nindent 14 }}
      ports:
        - port: bot-link
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.agentSelector | nindent 14 }}
      ports:
        - port: mcp
    {{- with include "mc-agents-mcp-server.metricsFrom" . }}
    # The scraper lives in another namespace, so it needs a rule of its own on the MCP port,
    # which is where /actuator/prometheus is. Kubelet probes need no rule: they come from the
    # node, and NetworkPolicy does not apply to them.
    - from:
        - namespaceSelector:
            matchLabels:
              {{- . | nindent 14 }}
      ports:
        - port: mcp
    {{- end }}
{{- end }}
