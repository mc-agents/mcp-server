{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mc-agents-mcp-server.secretName" . }}
  labels:
    {{- include "mc-agents-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey }}: {{ .Values.auth.token | quote }}
{{- end }}
{{- if and .Values.botLink.token (not .Values.botLink.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mc-agents-mcp-server.linkSecretName" . }}
  labels:
    {{- include "mc-agents-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The key the operator's linkTokenSecretRef defaults to, so a MinecraftBot needs only the name.
  token: {{ .Values.botLink.token | quote }}
{{- end }}
