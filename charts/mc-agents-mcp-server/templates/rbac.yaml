{{- if .Values.bots.provision }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "mc-agents-mcp-server.fullname" . }}
  # In the namespace the bots are made in, which is not always this release's.
  namespace: {{ default .Release.Namespace .Values.bots.namespace }}
  labels:
    {{- include "mc-agents-mcp-server.labels" . | nindent 4 }}
rules:
  # join-server creates a MinecraftBot when none is running under that name, and leave-server
  # takes back the ones it created. Pods are the operator's; this never touches one.
  - apiGroups: ["mc-agents.junhyung.cloud"]
    resources: ["minecraftbots"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "mc-agents-mcp-server.fullname" . }}
  namespace: {{ default .Release.Namespace .Values.bots.namespace }}
  labels:
    {{- include "mc-agents-mcp-server.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "mc-agents-mcp-server.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "mc-agents-mcp-server.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
