# A bot exists on the pod it dialled, and any agent may address any bot by name, so a second
# replica would answer about bots it cannot reach. Sticky sessions pin the caller, which is the
# wrong half. Scaling out means moving the bot link off this pod; scaling bots is the operator's.
replicaCount: 1

image:
  registry: junhyung.cloud/mc-agents
  repository: mcp-server
  # Empty falls back to Chart.appVersion. A promotion swaps only this value.
  tag: ""
  pullPolicy: IfNotPresent

# junhyung.cloud/mc-agents allows anonymous pull, so nothing is needed by default.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Needed only to create MinecraftBots. With bots.provision off, nothing here calls the API.
  automountToken: true

# join-server starts a bot when none is running under the name it was given, by creating a
# MinecraftBot for the operator to act on. Turning this off leaves join-server able to use bots
# that dial in and nothing else, and takes the Role away with it.
bots:
  provision: true
  # Where join-server creates MinecraftBots. Empty is this release's namespace. A bot belongs with
  # whatever uses it, not with the server that starts it, so a game in namespace "game" sets "game"
  # here. The Role that allows it goes there too.
  namespace: ""
  # What a bot is told to dial. Empty derives this release's own Service.
  mcpHost: ""
  # The profile every bot started here is built from. An empty name leaves it to the operator: the
  # namespace's MinecraftBotProfile "default", then the ClusterMinecraftBotProfile "default".
  profile:
    kind: MinecraftBotProfile
    name: ""
  # The Secret a bot started here is pointed at for its link token (spec.linkTokenSecretRef, key
  # "token"), in the namespace above. Empty is the chart's own link Secret, which is in this
  # release's namespace: a bot in another namespace needs a copy of it there, named here.
  linkSecret: ""

# The second gate on the bot link, after the NetworkPolicy: a bot's hello has to carry this token
# or the server refuses it, so a pod that reaches the port still cannot introduce itself as a bot.
# Unset, the server takes any bot that dials in. The bots the operator starts from this chart's
# MinecraftBots are handed the same Secret; a bot declared by hand needs spec.linkTokenSecretRef
# pointing at it.
botLink:
  # The token itself. Use existingSecret anywhere the values file is not the secret store.
  token: ""
  # Name of a Secret that already holds it under the key "token". The chart then creates none, and
  # a rotation does not roll the pod, as with auth.existingSecret.
  existingSecret: ""

# A shared bearer token on /mcp. /actuator is never behind it: a probe cannot carry one.
auth:
  enabled: true
  # The token itself. Use existingSecret anywhere the values file is not the secret store.
  token: ""
  # Name of a Secret that already holds it. When set, the chart creates none, and it cannot see
  # the value either: a rotation of that Secret does not roll the pod, so follow it with
  # `kubectl rollout restart`, or run stakater Reloader and set podAnnotations to
  # reloader.stakater.com/auto: "true".
  existingSecret: ""
  secretKey: token

service:
  type: ClusterIP
  mcpPort: 3000
  # Bots dial this. It is a separate port so a NetworkPolicy can open one and not the other.
  botLinkPort: 8765
  annotations: {}

# Bots reach the link port and agents reach the MCP port. Nothing else needs either, apart from
# whatever scrapes /actuator/prometheus; kubelet probes arrive outside any policy.
networkPolicy:
  enabled: false
  # Pods allowed to dial the bot link port. Empty means every pod in this namespace.
  botSelector: {}
  # Pods allowed to call /mcp. Empty means every pod in this namespace.
  agentSelector: {}
  # Namespace labels a scraper may reach the MCP port from, beside the agent pods above. Empty
  # opens it to no other namespace, except that with metrics.serviceMonitor on and given a
  # namespace, that namespace is let in, since that is where the scraper is.
  metricsFrom: {}

# How many bots may be linked at once. A bot that is turned away says this number.
maxBots: 16

# What linked bots are told in helloOk. A repeated action bar, title or dialog line is resent at this
# cadence and closed after three without a repeat. A muted feed is never sent by the bot at all,
# which is cheaper than dropping it here: chat, actionBar, title, dialog, effect, toast.
feeds:
  repeatFlushMs: 1000
  muted: []

logLevel: INFO

# Log lines as JSON in one of Spring Boot's structured formats: ecs, logstash or gelf. Empty keeps
# the plain lines, which are what a person reading `kubectl logs` wants; a log pipeline wants a
# format it can index by field.
logFormat: ""

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

metrics:
  # prometheus.io/scrape annotations on the pod, for a Prometheus that finds targets by them. A
  # Prometheus run by the operator ignores these and takes the ServiceMonitor below instead.
  enabled: true
  serviceMonitor:
    enabled: false
    # Where the ServiceMonitor is created. Empty is this release's namespace, which needs a
    # Prometheus that watches every namespace; a Prometheus that watches only its own wants the
    # ServiceMonitor there, and networkPolicy.metricsFrom then lets that namespace in.
    namespace: ""
    labels: {}
    interval: 30s
    scrapeTimeout: 10s
