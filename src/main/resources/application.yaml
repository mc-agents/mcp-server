spring:
  application:
    name: mcp-server
  ai:
    mcp:
      server:
        name: mc-agents
        version: ${mcagents.version:0.1.0}
        protocol: STREAMABLE
        # Tools are registered from the catalogue at startup, not discovered from annotations.
        # tools/list has to be complete before any bot has linked, so it cannot depend on them.
        capabilities:
          tool: true
          resource: false
          prompt: false

server:
  port: ${MCP_PORT:3000}
  address: ${MCP_BIND_HOST:0.0.0.0}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

mcagents:
  bot-link:
    # Bots dial in here. The server never has to know a pod address.
    port: ${BOT_LINK_PORT:8765}
    # How often a bot re-sends an action bar, title or dialog that is still showing. A run that nothing
    # has repeated for three of these is closed.
    repeat-flush-ms: ${BOT_LINK_REPEAT_FLUSH_MS:1000}
    # Feeds bots are told not to push, comma separated: chat, actionBar, title, dialog, effect, toast.
    # effect is the one a busy server floods.
    muted-feeds: ${BOT_LINK_MUTED_FEEDS:}
  bots:
    max: ${MCP_MAX_BOTS:16}
    # auto looks for a cluster only from inside one. always uses whatever kubeconfig is around,
    # which is for running this server locally against a cluster on purpose. never does not look.
    provision: ${MCP_BOTS_PROVISION:auto}
    # Where join-server creates a MinecraftBot. Empty uses the pod's own namespace.
    namespace: ${MCP_BOTS_NAMESPACE:}
    # What the bot is told to dial. Empty derives the chart's Service name in that namespace.
    mcp-host: ${MCP_BOTS_MCP_HOST:}
    # The MinecraftBotProfile (or ClusterMinecraftBotProfile, by kind) every bot started here is built
    # from. Empty leaves it to the operator: the namespace's "default", then the cluster's.
    profile:
      kind: ${MCP_BOTS_PROFILE_KIND:}
      name: ${MCP_BOTS_PROFILE_NAME:}
  auth:
    token: ${MCP_AUTH_TOKEN:}

logging:
  level:
    kr.junhyung.mcagents: ${MCP_LOG_LEVEL:INFO}
